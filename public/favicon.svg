<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The favicon as a miniature "grading slab" (DESIGN.md's signature
       CardArt component): a hairline-bordered void-black case, the same
       gold holo rarity strip, and a serif monogram in place of a card
       name — the app's own identity, reduced to its smallest form. Serif
       is Iowan Old Style (with the same fallback stack as everywhere
       else in the app) per DESIGN.md's Serif-Means-Precious Rule: a logo
       mark is exactly the kind of content that's meant to feel
       collectible-grade, so it reuses the display font already carrying
       that meaning in the Nav wordmark, rather than introducing a new
       one. -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="#0c0c0e" stroke="#333338" stroke-width="1"/>
  <rect x="6" y="6.2" width="20" height="3" rx="1.5" fill="url(#holo)"/>
  <text
    x="16"
    y="25.5"
    text-anchor="middle"
    font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Liberation Serif',serif"
    font-weight="700"
    font-size="17"
    fill="#e8e6e0"
  >D</text>
  <defs>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6af2d"/>
      <stop offset="0.5" stop-color="#f0c96b"/>
      <stop offset="1" stop-color="#e6af2d"/>
    </linearGradient>
  </defs>
</svg>
