    <!--
      THESIS: Owning a card is it being sealed and certified — the act of
      possession is the precious object, not just the art underneath.
      OWN-WORLD: void-black as a dim display case; every CardArt becomes a
      graded slab — rigid case corners, a top label strip carrying a
      holographic rarity strip, a mono serial number (the real exemplar id),
      the card name, and a numeric grade derived from float_value (higher =
      better condition, same convention the app already used for "best
      copy"). Locked cards render as an empty case with no label. Same
      void-black/molten-gold palette as before — that's a confirmed brand
      commitment, not up for revision — only the material language around
      it changes.
      STORY: the player doesn't "see a card," they "hold a sealed slab" —
      every exemplar carries a visible serial number, reinforcing that this
      specific copy (this float_value) is a unique certified object.
      FIRST VIEWPORT: Catálogo's grid — a wall of standing slabs, each with
      its label strip legible at grid scale.
      FORM: "The Grading Slab" — candidate 2 of 7 grounded directions
      (PSA/BGS graded-card slab), IMPECCABLE'S PICK over the dice-assigned
      "Price Guide Ledger" (candidate 3), user-confirmed. Seed key: 06e238d2.
      FINISH: unreviewed and undocumented is unfinished; this build ends
      with the finish review, the verdict, DESIGN.md, and every shipping
      raster carrying its provenance.
    -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
